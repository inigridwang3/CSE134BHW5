<section>
            <h2>Interactive Project Viewer</h2>
            <p>Explore our engineering highlights using our custom web component.</p>

            <!-- External Page Control to toggle attribute -->
            <button type="button" id="toggle-compact-btn">Toggle Compact View</button>

            <!-- The Custom Web Component -->
            <project-panel></project-panel>
           
            <noscript>
                <div class="noscript-fallback" style="padding: 1rem; border: 1px dashed var(--border-color, #ccc); margin-top: 1rem; border-radius: 8px;">
                    <p>⚠️ <strong>Enable JavaScript</strong> to load live data and interactive controls for this project widget.</p>
                </div>
            </noscript>
        </section>
    </main>

    <!-- External Toggle Control Listener (Part 1/3 Requirement) -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const toggleBtn = document.querySelector("#toggle-compact-btn");
        const projectPanel = document.querySelector("project-panel");

        if (toggleBtn && projectPanel) {
          toggleBtn.addEventListener("click", () => {
            projectPanel.toggleAttribute("compact");
          });
        }
      });
    </script>
</body>
</html>

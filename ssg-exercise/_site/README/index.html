<h1>SSG Exercise - Eleventy (11ty) Shared Section</h1>

<h2>Commands</h2>
<h3>Install Dependencies</h3>
<p>npm install</p>
<h3>Build Site</h3>
<p>npm run build</p>
<h3>Preview Locally</h3>
<p>npx @11ty/eleventy --serve</p>
